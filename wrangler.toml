# New Worker name prevents overwriting the deployed image service accidentally.
name = "kidzen-students-ai-tutor"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
TUTOR_MODEL = "gpt-6-astra"
SAFETY_MODEL = "gpt-6-astra"
TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"
TTS_MODEL = "gpt-4o-mini-tts"
TTS_VOICE = "coral"
# Confirm audio endpoint retention/consent configuration before enabling.
OPENAI_AUDIO_CONFIRMED = "false"
# Enable after implementing safe uploads, caregiver guidance and reporting.
PHOTO_UPLOAD_SAFEGUARDS_CONFIRMED = "false"
ALLOWED_ORIGINS = "https://your-app.example"
TOKEN_ISSUER = "kidzen-parent-backend"
TOKEN_AUDIENCE = "kidzen-tutor"
# Set true ONLY after OpenAI confirms Zero Data Retention for the API project.
# This flag is an operator attestation, not an OpenAI retention setting.
OPENAI_ZDR_CONFIRMED = "false"

[[durable_objects.bindings]]
name = "TUTOR_LIMITER"
class_name = "TutorLimiter"

[[migrations]]
tag = "tutor-v1"
new_sqlite_classes = ["TutorLimiter"]

[observability]
enabled = false
